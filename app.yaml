runtime: nodejs24 # Or your desired Node.js version
env: standard
entrypoint: node server.js

# Add network settings if needed
network:
  instance_tag: bracket-app

# Automatic scaling configuration
automatic_scaling:
  target_cpu_utilization: 0.65
  max_instances: 3
  target_throughput_utilization: 0.8
# manual_scaling: #old configuration for after the tournament
#   instances: 1 # Start with 1 instance, scale up later if needed

# Resources (adjust for your needs)
resources:
  cpu: 1
  memory_gb: 0.5
  disk_size_gb: 10
